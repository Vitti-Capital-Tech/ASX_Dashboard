name: Daily ASX Announcements

# NOTE: concurrency is declared on the fetch-and-summarise job, NOT here, so the
# cheap gate job never occupies the group. GitHub allows only 1 running + 1
# pending run per group and cancels the pending one on a third arrival — this
# scoping keeps that headroom for real fetches. (Tidiness, not a bug fix: run
# history shows 100/100 success and zero cancellations.)

on:
  # GitHub schedule is UTC-only. We trigger during the UTC hours that overlap the
  # desired Sydney window: every 5 min for the first two hours (08:00–10:00 AEST),
  # then hourly to 14:00 AEST. Job "gate" filters weekends; workflow_dispatch always runs.
  # 8am AEST = 22:00 UTC | 9am AEST = 23:00 UTC | 2pm AEST = 04:00 UTC
  #
  # Measured over 100 runs (Jul–Aug 2026): GitHub delivers only ~2 of the 12
  # events requested per hour here, and delays them 0–70 min. Nothing in a cron
  # file changes that, so keep the attempt count HIGH — each event is an
  # independent lottery ticket for landing a run before 23:00 UTC.
  # Offsets avoid :00, the scheduler's peak-load minute and the most-dropped one.
  schedule:
    # Every 5 min during first hour (08:00–09:00 AEST)
    # Sun-Thu UTC = Mon-Fri AEST (day rolls forward across the date line)
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 22 * * 0-4"

    # Every 5 min during second hour (09:00–10:00 AEST)
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 23 * * 0-4"

    # Every hour after that (10:00–14:00 AEST)
    # Mon-Fri UTC = Mon-Fri AEST (same calendar day)
    - cron: "10 0-4 * * 1-5"
    # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for today AEST."
        required: false
        default: ""

# Secrets (Settings → Secrets and variables → Actions):
#   GROQ_API_KEY        — recommended; failover if Anthropic errors
#   ANTHROPIC_API_KEY   — optional primary (Claude); omit to use Groq only
# Variables (optional overrides; leave unset to use fetch_asx.py defaults):
#   GROQ_MODEL, ANTHROPIC_MODEL
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.pick.outputs.proceed }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(python3 <<EOF
          from datetime import datetime
          import zoneinfo

          z = zoneinfo.ZoneInfo("Australia/Sydney")
          n = datetime.now(z)

          hour = n.hour
          weekday = n.weekday()  # 0=Mon, 6=Sun

          # Mon–Fri, 08:00–15:59 local. The crons already pin the exact minutes;
          # this gate only filters weekends and anything wildly out of band.
          # Upper bound is 15 (not 14) because during AEDT (UTC+11) the last
          # cron, 04:10 UTC, lands at 15:10 local and was being dropped.
          run = weekday < 5 and 8 <= hour <= 15

          print("true" if run else "false")
          EOF
          )

          echo "proceed=$OUT" >> "$GITHUB_OUTPUT"

  fetch-and-summarise:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Serialise only the real work (it pushes to main). Gate jobs no longer
    # occupy this group, so they cannot evict a queued fetch.
    concurrency:
      group: "daily-asx-fetch"
      cancel-in-progress: false
    permissions:
      contents: write # needed to commit logs/ back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ASX fetcher
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          # Blank date → default logic in fetch_asx.py (scheduled runs have no inputs)
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -u fetch_asx.py --date "${{ github.event.inputs.date }}"
          else
            python -u fetch_asx.py
          fi

      - name: Commit and push log file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "chore: ASX log $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
